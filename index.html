<style>
  /* Layout: a full-screen canvas solar system is the navigation; each planet opens a
     full-screen section that grows out of it as an expanding circle. Single, committed look. */
  :root {
    --sky: #FF5B14;      /* accent orange */
    --space: #04050A;    /* solar system background */
    --sun: #FFB21F;      /* warm golden yellow: core and main rays */
    --pale: #FFD866;     /* lighter yellow: selected rays and details */
    --deep: #D93A06;     /* deeper orange: occasional secondary accents */
    --ember: #120D0A;    /* black for typography */
    --paper: #ECEAE7;    /* wireframe ground */
    --ink: #1D1B19;      /* wireframe text */
    --wire: #CBC6C0;     /* placeholder blocks */
    --wire-2: #A9A39C;   /* placeholder strokes */
    --card: #F8F6F2;     /* light bento card */
    --bone: #E2DACA;     /* warm bento card */
    --edge: clamp(20px, calc(3.4 * var(--vw)), 44px);
    --f-display: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --f-mono: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --f-serif: "Young Serif", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--space); color: var(--ink); font-family: var(--f-display); overflow: hidden; }
  h1, h2, h3 { text-wrap: balance; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .sun-btn { -webkit-tap-highlight-color: transparent; border-radius: 50%; }
  .sun-btn:focus-visible { outline: 3px solid var(--ember); outline-offset: 6px; }

  /* Wireframe placeholders */
  .ph-img { background: var(--wire); position: relative; overflow: hidden; border: 1.5px solid var(--wire-2); }
  .ph-img::before, .ph-img::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top right, transparent calc(50% - .75px), var(--wire-2) calc(50% - .75px), var(--wire-2) calc(50% + .75px), transparent calc(50% + .75px));
  }

  /* View transitions: short slide + fade, direction follows the navigation */
  .view-enter { animation: viewIn .34s cubic-bezier(.2,.7,.2,1) both; }

  /* Hub navigation */
  .nav-item .dot { width: clamp(14px, calc(1.6 * var(--vw)), 22px); height: clamp(14px, calc(1.6 * var(--vw)), 22px); transform: scale(0); transition: transform .3s cubic-bezier(.3,1.5,.5,1); }

  .case { transition: background-color .2s, color .2s; }

  .case:hover .rounded-full { border-color: var(--paper); }

  .nav-btn:focus-visible, .nav-item:focus-visible, .card:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }


  /* Every control gets a hit area of at least 24×24px (44×44px on touch screens). The extra area is an invisible
     ::after layer, so the design does not change size, only how easy it is to tap. */
  :root { --vw: calc(1vw / var(--ui, 1)); --vh: calc(1vh / var(--ui, 1)); }
  .view-enter { --hit: 24px; }
  .view-enter > div { zoom: var(--ui, 1); }

    .view-enter .links-col { row-gap: 24px; padding-block: 10px; }
  }
  .view-enter :is(a[href], button, [role="tab"]):not(.absolute):not(.fixed):not(.sticky) { position: relative; }
  .view-enter :is(a[href], button, [role="tab"])::after {
    content: ""; position: absolute;
    top: min(0px, calc((100% - var(--hit)) / 2)); bottom: min(0px, calc((100% - var(--hit)) / 2));
    left: min(0px, calc((100% - var(--hit)) / 2)); right: min(0px, calc((100% - var(--hit)) / 2));

  /* Very short screens (landscape phones, small laptops with toolbars): the screen scrolls as a
     whole instead of squeezing panels, so nothing is ever cut off. */
  /* Phones and very short screens: the whole screen scrolls like a page, never a box inside a box */
  @media (max-height: 640px), (max-width: 767px), (orientation: portrait) and (max-width: 1199px) {
    .view-enter { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

    .view-enter figure { min-height: 300px; }

    .bd-grid { grid-auto-rows: auto; }
    .view-enter .egg-panel { overflow-y: auto !important; max-height: 100%; }
    .view-enter .spread-right.spread-right { min-height: max(600px, 92svh) !important; }
    .view-enter .spread-right > div:first-child { flex: 1 1 auto !important; display: flex; flex-direction: column; }
    .view-enter .spread-right .spread-text { flex: 1 1 auto; }

  /* ---- Bento Home ---- */
  .bento-frame { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 1024px) and (orientation: landscape) and (min-height: 660px), (min-width: 1200px) and (min-height: 660px) {

  .cell { animation: cellIn .8s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 70ms); }

  /* ---- Social Media & Content case studies ("practice" pages) ---- */
  .practice { --panel: #121110; background: var(--panel); color: var(--paper); height: 100%; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }

  .pr-title { margin: 0; font-family: var(--f-serif); font-weight: 400; font-size: clamp(26px, min(calc(3.3 * var(--vw)), calc(5.4 * var(--vh))), 56px); line-height: 1.08; letter-spacing: -0.01em; text-wrap: balance; color: var(--paper); }

  .pr-label { font-family: var(--f-serif); font-size: clamp(18px, min(calc(1.8 * var(--vw)), calc(3.2 * var(--vh))), 28px); line-height: 1.15; letter-spacing: -0.01em; }
  .pr-right { position: relative; min-height: 0; overflow: hidden;
    background: radial-gradient(110% 80% at 72% 18%, color-mix(in srgb, var(--acc) 15%, transparent), transparent 62%), #1A1816; }

  .pr-visual { flex: 1; min-height: 0; container-type: size; display: flex; padding: clamp(20px, calc(3 * var(--vw)), 44px) clamp(20px, calc(3 * var(--vw)), 44px) 8px; }
  .pr-visual > * { margin: auto; }
  .pr-copy { padding: 18px clamp(20px, calc(3 * var(--vw)), 44px) clamp(20px, calc(3.4 * var(--vh)), 38px); background: linear-gradient(to top, rgba(12,11,10,.9) 55%, rgba(12,11,10,0)); }
  .pr-statement { margin: 0 0 .55em; font-family: var(--f-serif); font-size: clamp(20px, min(calc(2.1 * var(--vw)), calc(3.8 * var(--vh))), 36px); line-height: 1.14; letter-spacing: -0.01em; color: var(--paper); text-wrap: balance; }

  /* pieces */
  .pr-cap { font: 500 11px/1.3 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: rgba(236,234,231,.6); }
  .pr-num { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.04em; line-height: .95; font-variant-numeric: tabular-nums; color: var(--paper); }
  .pr-phone { position: relative; height: min(100cqh, 470px); max-width: 100%; aspect-ratio: 430 / 815; border-radius: 30px; border: 6px solid #2B2926; overflow: hidden; background: #000; box-shadow: 0 30px 60px -30px rgba(0,0,0,.85); flex: none; }
  .pr-phone-notch { position: absolute; top: 6px; left: 50%; width: 30%; height: 14px; transform: translateX(-50%); border-radius: 99px; background: #000; z-index: 1; }
  .pr-browser { width: min(100%, 600px, calc((100cqh - 60px) * 2.1)); border: 1px solid rgba(236,234,231,.15); border-radius: 10px; overflow: hidden; background: #0E0E0E; box-shadow: 0 30px 60px -34px rgba(0,0,0,.9); }

  .pr-pipe li:nth-child(3n)::before { display: none; }
  .pr-pipe-dot { width: 31px; height: 31px; border-radius: 50%; border: 1px solid rgba(236,234,231,.4); display: grid; place-items: center; font: 500 11px var(--f-display); color: var(--paper); background: #1A1816; position: relative; }

  .pr-pillars > .pr-pillar:nth-child(1) { grid-area: 1 / 1; } .pr-pillars > .pr-pillar:nth-child(2) { grid-area: 1 / 3; }

  .pr-chip { font: 500 11px/1.25 var(--f-display); padding: 4px 6px; border-radius: 4px; color: var(--paper); border: 1px solid transparent; }
  .pr-chip.is-s { background: rgba(236,234,231,.1); }

  .pr-chip.is-w { border: 1px dashed rgba(236,234,231,.35); color: rgba(236,234,231,.8); }
  .pr-funnel { width: var(--w); border: 1px solid rgba(236,234,231,.18); padding: 10px 14px; display: flex; flex-direction: column; gap: 4px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--acc) 12%, transparent), transparent); }
  .pr-arch-core { border: 1px solid var(--acc-text); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; text-align: center; align-items: center; color: var(--paper); background: color-mix(in srgb, var(--acc) 10%, transparent); }
  .pr-feed { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }

  .pr-feed { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .pr-feed .pr-concept { grid-column: 1 / -1; justify-self: start; }
  .pr-post { background: #0C0C0C; border: 1px solid rgba(236,234,231,.14); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pr-post-light { background: #F4F2EE; color: var(--ink); border-color: transparent; }
  .pr-tk-avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #161514; color: var(--paper); border: 1px solid var(--acc); }
  .pr-creative { aspect-ratio: 1; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; background: #1C1B19; color: var(--paper); border: 1px solid rgba(236,234,231,.1); min-width: 0; overflow: hidden; }
  .pr-post .pr-creative { aspect-ratio: 16 / 9; }
  .pr-creative.is-acc { background: var(--acc); color: #111; border-color: transparent; }
  .pr-creative-big { font-family: var(--f-display); font-weight: 700; font-size: clamp(14px, calc(1.45 * var(--vw)), 22px); line-height: 1; letter-spacing: -0.03em; }
  .pr-concept { display: inline-block; font: 500 11px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--acc-text); border: 1px dashed var(--acc-text); border-radius: 99px; padding: 5px 9px; }

  /* phones, short screens, portrait tablets: chapter after chapter */
  .practice.is-paged { display: block; height: auto; }
  .practice.is-paged .pr-panel { position: static; animation: none; }
  .practice.is-paged .pr-visual { container-type: inline-size; padding: 4px 20px 18px; }
  .practice.is-paged .pr-phone { height: 440px; max-height: 70vh; }

  .practice.is-paged .pr-copy { background: none; padding: 0 20px 26px; }

  @media (max-width: 639px) { .pr-msg-grid .pr-creative { aspect-ratio: auto; min-height: 150px; } }

    .pr-feed { grid-template-columns: minmax(0, 1fr); } .pr-feed .pr-feed-b { margin-top: 0; }
    .pr-pillars { grid-template-columns: minmax(0, 1fr); } .pr-pillar-core { grid-row: auto; grid-column: auto; justify-self: center; }
    .pr-pillars > .pr-pillar:nth-child(n) { grid-area: auto; }
    .pr-pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pr-pipe li::before { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .pr-panel { animation: none; } .pr-item { transition: none; } }
  /* ---- BD case spread ---- */
  /* desktop: two equal portrait pages, the spread scaled as a whole to fit the screen (like an open book) */
  .spread-stage { display: flex; flex-direction: column; }
  .spread-stage > .spread { flex: 1; }
  @media (min-height: 641px) and (min-width: 768px) and (orientation: landscape), (min-height: 641px) and (min-width: 1200px) {
    .spread-stage { container-type: size; display: grid; place-items: center; }
    .spread-stage > .spread { flex: none; width: min(100cqw, 148cqh); height: min(100cqh, calc(100cqw / 1.48)); }
  }
  /* short landscape screens: the book opens a little wider so the text keeps its size */
  @media (min-height: 641px) and (max-height: 780px) and (min-width: 768px) and (orientation: landscape) {
    .spread-stage > .spread { width: min(100cqw, 170cqh); height: min(100cqh, calc(100cqw / 1.7)); }
  }

  .spread { --page-dark: #161412; --page-light: #F7F5F1; border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
  .spread-left { background: var(--page-dark); color: var(--paper); }
  .spread-left::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 1px; background: rgba(255,255,255,.06); }
  .spread-right { background: var(--page-light); }
  .spread-fig { position: relative; overflow: hidden; outline: 1px solid rgba(255,255,255,.08); }
  .spread-fig img, .spread-fig video { filter: grayscale(1) contrast(1.04); transition: filter .6s ease, transform .9s cubic-bezier(.2,.8,.2,1); }
  .spread-fig:hover img, .spread-fig:hover video, .spread-fig:focus-visible img { filter: none; transform: scale(1.015); }
  .spread-fig:focus-visible { outline: 2px solid var(--sky); outline-offset: 4px; }
  .spread-play { color: var(--ink); background: rgba(247,245,241,.92); transition: opacity .3s, transform .3s; }
  .spread-play:hover { transform: scale(1.06); }
  .spread-play.is-playing { opacity: 0; }
  .spread-fig:hover .spread-play.is-playing, .spread-play.is-playing:focus-visible { opacity: 1; }
  .spread-plate { aspect-ratio: 16 / 10; display: grid; place-items: center; text-align: center; padding: 8%; border: 1px solid rgba(255,255,255,.1); overflow: hidden; }
  .spread-fig img { aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }
  .spread-body p { margin: 0; font-size: clamp(13.5px, calc(1 * var(--vw)), 15px); line-height: 1.55; color: color-mix(in srgb, var(--ink) 82%, transparent); text-align: left; }
  @media (min-width: 768px) { .spread-body p { text-align: justify; -webkit-hyphens: auto; hyphens: auto; } }
  /* pages settle in, the right one a beat later */
  .spread-left > :first-child { animation: pageIn .7s cubic-bezier(.2,.8,.2,1) both; }
  .spread-text { animation: pageIn .7s .12s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .spread-left > :first-child, .spread-text { animation: none; } .spread-fig img, .spread-fig video { transition: none; } }
  /* Type cube (Home numbers card) */
  /* when the bento rows size to their content (short or narrow screens), the cube card keeps room to turn */
  @media (max-height: 659px) { .bento .cube-cell { min-height: 280px; } .bento .exp-cell { min-height: 96px; } }
  .tc-stage { position: absolute; inset: 0; container-type: size; display: grid; place-items: center; padding-top: 30px; }
  .tc-tilt { --s: min(calc((100cqh - 30px) / 1.5), calc(100cqw / 1.46)); width: var(--s); height: var(--s); transform-style: preserve-3d; transform: rotateX(-24deg); }
  .tc-cube { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; will-change: transform; animation: tcSpin 16s infinite; }
  .tc-stage:hover .tc-cube { animation-play-state: paused; }
  @keyframes tcSpin {
    0%, 19% { transform: rotateY(-45deg); animation-timing-function: cubic-bezier(.65,0,.35,1); }
    25%, 44% { transform: rotateY(-135deg); animation-timing-function: cubic-bezier(.65,0,.35,1); }
    50%, 69% { transform: rotateY(-225deg); animation-timing-function: cubic-bezier(.65,0,.35,1); }
    75%, 94% { transform: rotateY(-315deg); animation-timing-function: cubic-bezier(.65,0,.35,1); }

<script>
const { useEffect, useRef, useState, useCallback } = React;

/* =====================================================================

const prefersReduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Procedural noise (tileable on the horizontal axis) ---------- */

  ringed: withFn((u, v) => {

  // Experience: banded gas giant with turbulent belts and a storm
  giant: withFn((u, v) => {
    const warp = (fbm(u, v, 5, 6, 21) - 0.5) * 0.09;
    const lat = v + warp;
    const bands = Math.sin(lat * Math.PI * 11) * 0.5 + 0.5;
    const swirl = fbm(u + lat * 0.3, v, 4, 18, 22);
    let c = ramp([[0, hex('#5e3020')], [0.35, hex('#a35a32')], [0.6, hex('#d8a06a')], [0.85, hex('#ecd3ac')], [1, hex('#f4e6cc')]], bands * 0.75 + swirl * 0.25);

    const cloud = fbm(u, v, 5, 6, 33);
    const pole = Math.abs(v - 0.5) * 2;

    if (land > 0.56) c = ramp([[0, hex('#4f6b3a')], [0.5, hex('#7d8a4e')], [1, hex('#b39a6b')]], (land - 0.56) * 4);

/* Sun: two scalar noise layers combined every frame for a moving plasma */
const SUN_TW = 512, SUN_TH = 256;
function makeSunLayers() {

/* ---------- Sphere lookup tables ---------- */
/* For a disc of diameter D device pixels: which pixels are inside, their longitude/latitude

function makeSphere(D) {
  const idx = [], u0 = [], vv = [], nx = [], ny = [], nz = [], al = [];
  const R = D / 2;
  for (let y = 0; y < D; y++) for (let x = 0; x < D; x++) {
    const px = (x + 0.5 - R) / R, py = (y + 0.5 - R) / R;
    const d2 = px * px + py * py;

    const d = Math.sqrt(d2);

    u0.push(Math.atan2(px, z) / (Math.PI * 2));
    vv.push(Math.acos(clamp(py, -1, 1)) / Math.PI);
    nx.push(px); ny.push(py); nz.push(z);
    al.push(clamp01((1 - d) * R + 0.5));

  canvas.width = canvas.height = D;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(D, D);

    idx: Int32Array.from(idx), u0: Float32Array.from(u0), v: Float32Array.from(vv),
    nx: Float32Array.from(nx), ny: Float32Array.from(ny), nz: Float32Array.from(nz), al: Float32Array.from(al) };
}

/* Paint a lit planet into its sphere bitmap. L = light direction (screen space, z toward viewer). */
function paintPlanet(S, tex, rot, Lx, Ly, Lz, amb) {
  const d = S.img.data;
  for (let k = 0; k < S.n; k++) {
    let tu = ((S.u0[k] + rot) * TW) | 0;
    tu = ((tu % TW) + TW) % TW;
    const tv = Math.min(TH - 1, (S.v[k] * TH) | 0);
    const t = (tv * TW + tu) * 3;
    const lam = S.nx[k] * Lx + S.ny[k] * Ly + S.nz[k] * Lz;

/* Paint the sun: two noise layers rotating at different speeds, limb darkening, hot core */
function paintSun(S, L, ra, rb, pulse) {
  const d = S.img.data;
  for (let k = 0; k < S.n; k++) {

    let ua = ((S.u0[k] + ra) * SUN_TW) | 0; ua = ((ua % SUN_TW) + SUN_TW) % SUN_TW;

/* orbit: fraction of the outermost orbit. speed: radians per second (sign = direction).

const BODIES = [

/* ---- Contact: a line-drawn orrery. Ink only, tilted orbits, planets travelling in real time ---- */
const ORRERY = {
  cx: 200, cy: 200, tilt: -22, flat: 0.44, sunR: 30,
  // a = orbit radius, r = planet size, dash = dotted orbit, w = orbit line weight
  planets: [
    { name: 'Mercury', a: 46,  r: 2.0, w: 0.8 },
    { name: 'Venus',   a: 62,  r: 3.1, w: 0.8, dash: '1 3' },
    { name: 'Earth',   a: 80,  r: 3.4, w: 1.0, moon: true },
    { name: 'Mars',    a: 98,  r: 2.6, w: 0.8 },
    { name: 'Jupiter', a: 132, r: 7.0, w: 1.2 },
    { name: 'Saturn',  a: 154, r: 5.4, w: 1.0, ring: true },
    { name: 'Uranus',  a: 174, r: 4.2, w: 0.8, dash: '1 3' },
    { name: 'Neptune', a: 192, r: 4.0, w: 1.4 },
  ],
  belt: { a: 114, spread: 5, count: 90 },
};
// Kepler-ish: outer planets are slower. Starting angles spread around the ellipse.
ORRERY.planets.forEach((p, i) => { p.speed = 0.9 * Math.pow(46 / p.a, 1.5); p.start = (i * 2.399) % (Math.PI * 2); });
const BELT = Array.from({ length: ORRERY.belt.count }, (_, i) => ({
  t: (i / ORRERY.belt.count) * Math.PI * 2 + Math.sin(i * 12.9898) * 0.05,
  da: Math.sin(i * 78.233) * ORRERY.belt.spread, r: 0.45 + ((i * 7) % 5) * 0.12,
}));

function orreryPoint(a, t) {
  const { cx, cy, tilt, flat } = ORRERY;
  const x = Math.cos(t) * a, y = Math.sin(t) * a * flat;
  const k = (tilt * Math.PI) / 180, c = Math.cos(k), s = Math.sin(k);
  return { x: cx + x * c - y * s, y: cy + x * s + y * c, front: Math.sin(t) };
}

function ArtSystem() {
  const pRefs = useRef([]), moonRef = useRef(null), beltRef = useRef(null), sunRef = useRef(null);
  useEffect(() => {
    const reduced = prefersReduced();
    const { sunR, cx, cy } = ORRERY;
    let raf, t0 = performance.now();
    const draw = (now) => {
      const T = reduced ? 0 : (now - t0) / 1000;
      ORRERY.planets.forEach((p, i) => {
        const g = pRefs.current[i]; if (!g) return;
        const ang = p.start + T * p.speed;
        const pt = orreryPoint(p.a, ang);
        const scale = 1 + pt.front * 0.14;              // a touch bigger on the near side
        // hide a planet while it passes behind the sun's disc
        const behind = pt.front < 0 && Math.hypot(pt.x - cx, pt.y - cy) < sunR + p.r;
        g.setAttribute('transform', `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) scale(${scale.toFixed(3)})`);
        g.style.opacity = behind ? '0' : '1';
        if (p.moon && moonRef.current) {
          const m = ang * 9;
          moonRef.current.setAttribute('cx', (Math.cos(m) * 7).toFixed(2));
          moonRef.current.setAttribute('cy', (Math.sin(m) * 3).toFixed(2));
        }
      });
      if (beltRef.current) {
        const off = T * 0.05;
        const kids = beltRef.current.children;
        BELT.forEach((b, i) => {
          const pt = orreryPoint(ORRERY.belt.a + b.da, b.t + off);
          kids[i].setAttribute('cx', pt.x.toFixed(2)); kids[i].setAttribute('cy', pt.y.toFixed(2));
          kids[i].style.opacity = pt.front < 0 && Math.hypot(pt.x - cx, pt.y - cy) < sunR ? '0' : '1';
        });
      }
      if (sunRef.current && !reduced) sunRef.current.setAttribute('r', (sunR + 4 + Math.sin(T * 0.8) * 1.5).toFixed(2));
      if (!reduced) raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, []);

  const { cx, cy, tilt, flat, sunR } = ORRERY;
  return html`
    <svg viewBox="0 0 400 400" className="w-full h-full max-h-full" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="Line drawing of the solar system: the sun and eight planets moving along tilted orbits">
      <g transform=${`rotate(${tilt} ${cx} ${cy})`}>
        ${ORRERY.planets.map((p) => html`<ellipse key=${p.name} cx=${cx} cy=${cy} rx=${p.a} ry=${p.a * flat}
          fill="none" stroke="var(--ink)" strokeWidth=${p.w} strokeDasharray=${p.dash || null} vectorEffect="non-scaling-stroke" />`)}
      </g>
      <g ref=${beltRef} fill="var(--ink)">
        ${BELT.map((b, i) => html`<circle key=${i} r=${b.r} cx=${cx} cy=${cy} />`)}
      </g>
      <!-- sun: solid disc with a fine breathing halo -->
      <circle ref=${sunRef} cx=${cx} cy=${cy} r=${sunR + 4} fill="none" stroke="var(--ink)" strokeWidth="0.6" strokeDasharray="1 2.5" />
      <circle cx=${cx} cy=${cy} r=${sunR} fill="var(--ink)" />
      ${ORRERY.planets.map((p, i) => html`
        <g key=${p.name} ref=${(el) => (pRefs.current[i] = el)} transform=${`translate(${cx} ${cy})`}>
          ${p.ring && html`<ellipse rx=${p.r * 2.1} ry=${p.r * 0.7} fill="none" stroke="var(--ink)" strokeWidth="1" transform=${`rotate(${tilt})`} />`}
          <circle r=${p.r} fill="var(--ink)" />
          ${p.moon && html`<circle ref=${moonRef} r="1.1" cx="7" cy="0" fill="var(--ink)" />`}
        </g>`)}
    </svg>`;
}

function EasterEgg({ onClose }) {

/* FitBox: if the content is taller than its area, scale it down evenly until it fits, so nothing
   needs scrolling. Phones keep a readable floor and scroll past it; very short screens scroll as a page. */
function FitBox({ className = '', innerClassName = '', min = 0.6, watch, children }) {
  const outer = useRef(null), inner = useRef(null);
  useEffect(() => {
    const o = outer.current, n = inner.current; if (!o || !n) return;
    const fit = () => {
      n.style.zoom = '1';
      const cs = getComputedStyle(o);
      const avail = o.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 1; if (avail <= 0) return;
      const lo = window.matchMedia(PAGE_MQ).matches ? 1 : min; // page-scroll screens never shrink text
      let z = 1;
      for (let k = 0; k < 5; k++) {
        const h = n.getBoundingClientRect().height / uiNow();
        if (h <= avail + 0.5) break;
        z = Math.max(lo, z * (avail / h) * 0.99);
        n.style.zoom = String(z);
        if (z === lo) break;
      }
    };
    fit();
    const ro = new ResizeObserver(fit); ro.observe(o);
    document.fonts?.ready?.then(fit);
    return () => ro.disconnect();
  }, [watch]);
  return html`<div ref=${outer} className=${'min-h-0 overflow-y-auto overflow-x-hidden ' + className}><div ref=${inner} className=${innerClassName}>${children}</div></div>`;
}

/* Fit: a heading that keeps its designed size, but shrinks when one word is wider than its column
   (long names like "LaunchMyNFT" can't wrap, so they would otherwise run into the next column). */
function Fit({ as = 'h1', className = '', children, ...rest }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const fit = () => {
      el.style.fontSize = '';
      const w = el.clientWidth; if (!w) return;
      const words = [...el.querySelectorAll('[data-w]')];
      const widest = Math.max(...words.map((s) => s.getBoundingClientRect().width / uiNow()), 0);
      if (widest > w) {
        const cur = parseFloat(getComputedStyle(el).fontSize);
        el.style.fontSize = Math.max(16, cur * (w / widest) * 0.97) + 'px';
      }
    };
    fit();
    const ro = new ResizeObserver(fit); ro.observe(el);
    document.fonts?.ready?.then(fit);
    return () => ro.disconnect();
  }, [children]);
  // each word is measured on its own
  const text = typeof children === 'string' ? children : String(children ?? '');
  const parts = text.split(/(\s+)/);
  return React.createElement(as, { ref, className: className + ' min-w-0 max-w-full', ...rest },
    parts.map((p, i) => (/^\s+$/.test(p) ? p : React.createElement('span', { key: i, 'data-w': '', className: 'inline-block' }, p))));
}

function CaseMedia({ p }) {
  const ref = useRef(null);
  const [playing, setPlaying] = useState(false);
  const toggle = () => { const v = ref.current; if (!v) return; if (v.paused) { v.play().catch(() => setPlaying(false)); } else { v.pause(); } };
  if (p.video) return html`
    <figure className="spread-fig group relative m-0">
      <video ref=${ref} src=${p.video.src} poster=${p.video.poster || p.shot} playsInline preload="metadata"
        onPlay=${() => setPlaying(true)} onPause=${() => setPlaying(false)} onEnded=${() => setPlaying(false)}
        className="block w-full h-auto" aria-label=${p.name + ' video'}></video>
      <button type="button" onClick=${toggle} aria-label=${playing ? 'Pause video' : 'Play video'}
        className=${'spread-play absolute inset-0 m-auto w-16 h-16 rounded-full grid place-items-center ' + (playing ? 'is-playing' : '')}>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">${playing

          : html`<path d="M8 5l11 7-11 7z" fill="currentColor" />`}</svg>

    </figure>`;
  if (p.shot) return html`
    <a href=${p.links[0]} target="_blank" rel="noopener noreferrer" className="spread-fig group block" aria-label=${'Open ' + p.name + ' website (' + host(p.links[0]) + ')'}>
      <img src=${p.shot} alt=${p.name + ' homepage, captured November 2026'} className="block w-full h-auto" />

  // no capture: the name, set as a plate
  return html`

/* Shows an address as selectable text, with a copy button (mailto/tel links are unreliable here) */
function Copyable({ label, value }) {
  const [done, setDone] = useState(false);
  const ref = useRef(null);
  const copy = () => {
    const ok = () => { setDone(true); setTimeout(() => setDone(false), 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(ref.current); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(value).then(ok, fallback); } catch (e) { fallback(); }
  };
  return html`
    <div className="flex flex-wrap items-baseline gap-x-4 gap-y-1 border-t-[1.5px] border-ink/80 py-2.5">
      <span className="tag text-ink/65 w-14 shrink-0">${label}</span>
      <span ref=${ref} className="font-mono text-[13px] select-all break-all">${value}</span>
      <button type="button" onClick=${copy} className="nav-btn tag ml-auto text-ink/67 hover:text-sky">${done ? 'Copied' : 'Copy'}</button>
    </div>`;
}

/* Numbers count up once when the card appears */
function CountUp({ value, ms = 1100 }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const m = String(value).match(/^([\d.]+)(.*)$/);
    if (!m || prefersReduced()) { el.textContent = value; return; }
    const target = parseFloat(m[1]), suffix = m[2], dec = (m[1].split('.')[1] || '').length;
    let raf, t0 = performance.now();
    const tick = (now) => {
      const k = easeOut(clamp01((now - t0) / ms));
      el.textContent = (target * k).toFixed(dec) + suffix;
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return html`<span ref=${ref}>${value}</span>`;
}

/* Type cube: one result per side and a title on top. It stops at the isometric angle on each pair of
   faces, holds so they can be read, then turns. Numbers are stretched to the full width of the face,
   like poster type; labels keep their natural width. Decorative (aria-hidden): the data is in an sr-only list. */
function TypeCube({ top, sides }) {
  const T = (props, t) => html`<text fill="currentColor" fontFamily="var(--f-display)" ...${props}>${t}</text>`;
  const fitLen = (t, size, track) => (t.length * size * 0.68 + t.length * track > 88 ? { textLength: 88, lengthAdjust: 'spacingAndGlyphs' } : {});
  const side = ([v, k], i) => html`
    <svg viewBox="0 0 100 100" className="tc-svg" aria-hidden="true">
      ${T({ x: 6, y: 16, fontSize: 7, letterSpacing: 1, fillOpacity: 0.6 }, pad2(i + 1) + ' / ' + pad2(sides.length))}
      ${T({ x: 6, y: 60, fontSize: 52, fontWeight: 700, textLength: 88, lengthAdjust: 'spacingAndGlyphs' }, v)}
      <line x1="6" x2="94" y1="70" y2="70" stroke="currentColor" strokeWidth="1.2" />
      ${T({ x: 6, y: 85, fontSize: 11, fontWeight: 600, letterSpacing: 1, ...fitLen(k, 11, 1) }, k)}
    </svg>`;
  const topFace = html`
    <svg viewBox="0 0 100 100" className="tc-svg" aria-hidden="true">
      ${top.map((t, i) => T({ key: t, x: 6, y: 44 + i * 40, fontSize: 40, fontWeight: 700, textLength: 88, lengthAdjust: 'spacingAndGlyphs' }, t))}
    </svg>`;
  const cls = ['tc-front', 'tc-right', 'tc-back', 'tc-left'];
  return html`
    <div className="tc-stage" aria-hidden="true">
      <div className="tc-tilt">
        <div className="tc-cube">
          <div className="tc-face tc-top">${topFace}</div>
          ${sides.map((d, i) => html`<div key=${d[1]} className=${'tc-face ' + cls[i]}>${side(d, i)}</div>`)}
        </div>
      </div>
    </div>`;
}

/* ---------- App: solar system ⇄ sections ---------- */
function App() {
  const [phase, setPhase] = useState('space'); // space | entering | open | closing
  const phaseRef = useRef(phase); phaseRef.current = phase;
  const [view, setView] = useState({ name: null, id: null, dir: 1 });
  const viewRef = useRef(view); viewRef.current = view;
  const [page, setPage] = useState(0);
  const [, setAssets] = useState(!!window.IMG);
  useEffect(() => { if (window.IMG) return; const on = () => setAssets(true); window.addEventListener('assets-ready', on); return () => window.removeEventListener('assets-ready', on); }, []);
  const sysApi = useRef(null);
  const portRef = useRef(null);
  const anim = useRef(0);

  /* circular reveal of the section layer, growing out of (or shrinking into) the planet */
  const runReveal = useCallback((from, to, center, rMin, dur, done) => {
    const el = portRef.current; if (!el) return;
    cancelAnimationFrame(anim.current);
    const reduced = prefersReduced();
    const maxR = Math.max(
      Math.hypot(center.x, center.y), Math.hypot(window.innerWidth - center.x, center.y),
      Math.hypot(center.x, window.innerHeight - center.y), Math.hypot(window.innerWidth - center.x, window.innerHeight - center.y)) + 8;
    const t0 = performance.now();
    const step = (now) => {
      const k = clamp01((now - t0) / (reduced ? 220 : dur));
      const p = lerp(from, to, easeInOut(k));
      if (reduced) { el.style.clipPath = 'none'; el.style.opacity = String(p); }
      else {
        el.style.opacity = p > 0 ? '1' : '0';
        el.style.clipPath = p >= 1 ? 'none' : `circle(${lerp(rMin, maxR, p).toFixed(1)}px at ${center.x.toFixed(1)}px ${center.y.toFixed(1)}px)`;
      }
      if (k < 1) anim.current = requestAnimationFrame(step); else done && done();
    };
    anim.current = requestAnimationFrame(step);
  }, []);

  const onEnter = useCallback((key) => {
    setView({ name: key, id: null, dir: 1 }); setPage(0);
    setPhase('entering');
    const t = sysApi.current?.target() || { x: innerWidth / 2, y: innerHeight / 2, r: 40 };
    requestAnimationFrame(() => runReveal(0, 1, t, t.r, 620, () => setPhase('open')));
  }, [runReveal]);

  const close = useCallback(() => {
    if (phaseRef.current !== 'open') return;
    setPhase('closing');
    // let the system draw one frame at its zoomed state, then shrink the section into the planet
    requestAnimationFrame(() => {
      const t = sysApi.current?.target() || { x: innerWidth / 2, y: innerHeight / 2, r: 40 };
      runReveal(1, 0, t, t.r, 480, () => {
        setPhase('space');
        setView({ name: null, id: null, dir: -1 });
        sysApi.current?.returnToOrbit();
      });
    });
  }, [runReveal]);

  const go = useCallback((name, id = null, dir = 1) => setView((v) => ({ name, id, dir, from: v.name === 'index' ? 'index' : v.from })), []);
  const back = useCallback(() => {
    const v = viewRef.current;
    if (v.name === 'project') { setPage(0); setView({ name: 'portfolio', id: null, dir: -1, from: v.from }); }
    else if (v.name !== 'index') setView({ name: 'index', id: null, dir: -1 });
    else close();
  }, [close]);

  useEffect(() => {
    const onKey = (e) => {
      if (phaseRef.current !== 'open') return;
      const v = viewRef.current;
      if (e.key === 'Escape') back();
      if (v.name === 'portfolio' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft'))
        setPage((p) => clamp(p + (e.key === 'ArrowRight' ? 1 : -1), 0, PAGES - 1));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [back]);

  const showPort = phase !== 'space';

  return html`
    <main className="relative h-full w-full overflow-hidden bg-space">
      <${SolarSystem} api=${sysApi} onEnter=${onEnter} hidden=${phase === 'open'} />
      <p className="tag absolute pointer-events-none select-none" aria-hidden=${showPort ? 'true' : 'false'}
         style=${{ color: 'rgba(255,255,255,.62)', letterSpacing: '.2em', fontSize: 'calc(11px * var(--ui, 1))', left: 'max(var(--edge), calc(env(safe-area-inset-left, 0px) + var(--edge)))', top: 'calc(env(safe-area-inset-top, 0px) + var(--edge))' }}>
        Flavio Veloso — Portfolio
      </p>
      <div
        ref=${portRef}
        hidden=${!showPort}
        className="absolute inset-0 overflow-hidden bg-paper text-ink"
        style=${{ opacity: 0, clipPath: 'circle(0px at 50% 50%)', overscrollBehavior: 'contain' }}
      >
        ${showPort && html`<${Portfolio} view=${view} go=${go} back=${back} onSun=${close} page=${page} setPage=${setPage} />`}
      </div>
    </main>`;
}

/* If anything fails to render, show a calm fallback with a way to reach Flávio, instead of a blank screen */
class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { failed: false }; }
  static getDerivedStateFromError() { return { failed: true }; }
  componentDidCatch(err) { console.error(err); }
  render() {
    if (!this.state.failed) return this.props.children;
    return html`
      <main className="h-full grid place-items-center bg-paper text-ink p-6 text-center">
        <div className="flex flex-col items-center gap-4 max-w-[44ch]">
          <span className="tag text-ink/65">Something went wrong</span>
          <h1 className="font-display font-bold tracking-[-0.03em] text-[clamp(32px,6vw,56px)] leading-none">Flávio Veloso</h1>
          <p className="font-serif text-lg leading-snug">This page didn’t load properly. Reloading usually fixes it, or reach me directly.</p>
          <div className="flex flex-wrap justify-center gap-3 pt-2">
            <button type="button" onClick=${() => location.reload()} className="nav-btn tag rounded-full bg-ink text-paper px-5 py-3 hover:bg-sky">Reload</button>
            <a href=${'mailto:' + ME.email} className="nav-btn tag rounded-full border-[1.5px] border-ink px-5 py-3 hover:bg-ink hover:text-paper">Email me</a>
          </div>
        </div>
      </main>`;
  }
}

/* Tabs: arrow keys, Home and End move between tabs in the same list (and select them) */
window.addEventListener('keydown', (e) => {
  const tab = e.target.closest && e.target.closest('[role="tab"]'); if (!tab) return;
  const list = tab.closest('[role="tablist"]'); if (!list) return;
  const tabs = [...list.querySelectorAll('[role="tab"]')]; const i = tabs.indexOf(tab);
  const next = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
  if (next === undefined) return;
  e.preventDefault(); e.stopImmediatePropagation();
  const t = tabs[(next + tabs.length) % tabs.length]; t.focus(); t.click();
}, true);

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Boundary}><${App} /><//>`);
