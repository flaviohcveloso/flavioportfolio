<title>Flavio Veloso Sun</title>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          // Primary: Instrument Sans. Secondary: Young Serif.
          display: ['"Instrument Sans"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          sans: ['"Instrument Sans"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          mono: ['"Instrument Sans"', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          serif: ['"Young Serif"', 'Georgia', '"Times New Roman"', 'serif'],
        },
        colors: {
          // color-mix lets opacity modifiers like text-ink/50 work with CSS-variable colors
          sky: 'color-mix(in srgb, var(--sky) calc(<alpha-value> * 100%), transparent)', space: 'color-mix(in srgb, var(--space) calc(<alpha-value> * 100%), transparent)', sun: 'color-mix(in srgb, var(--sun) calc(<alpha-value> * 100%), transparent)', ember: 'color-mix(in srgb, var(--ember) calc(<alpha-value> * 100%), transparent)',
          paper: 'color-mix(in srgb, var(--paper) calc(<alpha-value> * 100%), transparent)', ink: 'color-mix(in srgb, var(--ink) calc(<alpha-value> * 100%), transparent)', wire: 'color-mix(in srgb, var(--wire) calc(<alpha-value> * 100%), transparent)', wire2: 'color-mix(in srgb, var(--wire-2) calc(<alpha-value> * 100%), transparent)',
        },
      },
    },
  };
</script>
<style>
  /* Layout: a full-screen canvas solar system is the navigation; each planet opens a
     full-screen section that grows out of it as an expanding circle. Single, committed look. */
  :root {
    --sky: #FF5B14;      /* accent orange */
    --space: #04050A;    /* solar system background */
    --sun: #FFB21F;      /* warm golden yellow: core and main rays */
    --pale: #FFD866;     /* lighter yellow: selected rays and details */
    --deep: #D93A06;     /* deeper orange: occasional secondary accents */
    --ember: #120D0A;    /* black for typography */
    --paper: #ECEAE7;    /* wireframe ground */
    --ink: #1D1B19;      /* wireframe text */
    --wire: #CBC6C0;     /* placeholder blocks */
    --wire-2: #A9A39C;   /* placeholder strokes */
    --edge: clamp(20px, 3.4vw, 44px);
    --f-display: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --f-mono: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --f-serif: "Young Serif", Georgia, "Times New Roman", serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--space); color: var(--ink); font-family: var(--f-display); overflow: hidden; }
  h1, h2, h3 { text-wrap: balance; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .sun-btn { -webkit-tap-highlight-color: transparent; border-radius: 50%; }
  .sun-btn:focus-visible { outline: 3px solid var(--ember); outline-offset: 6px; }

  /* Wireframe placeholders */
  .ph-img { background: var(--wire); position: relative; overflow: hidden; border: 1.5px solid var(--wire-2); }
  .ph-img::before, .ph-img::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top right, transparent calc(50% - .75px), var(--wire-2) calc(50% - .75px), var(--wire-2) calc(50% + .75px), transparent calc(50% + .75px));
  }
  .ph-img::after { transform: scaleX(-1); }
  .tag { font-family: var(--f-display); font-size: 11px; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; }
  .ph-text { background: var(--wire); border-radius: 2px; height: 10px; }
  .ph-note { border: 1.5px dashed var(--wire-2); }

  /* View transitions: short slide + fade, direction follows the navigation */
  .view-enter { animation: viewIn .34s cubic-bezier(.2,.7,.2,1) both; }
  .from-right { --dx: 28px; } .from-left { --dx: -28px; }
  @keyframes viewIn { from { opacity: 0; transform: translateX(var(--dx)); } to { opacity: 1; transform: none; } }
  .preview-in { animation: fadeIn .25s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Hub navigation */
  .nav-item .dot { width: clamp(14px, 1.6vw, 22px); height: clamp(14px, 1.6vw, 22px); transform: scale(0); transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
  .nav-item .label { color: color-mix(in srgb, var(--ink) 36%, transparent); transition: color .25s, transform .3s cubic-bezier(.2,.7,.2,1); }
  .nav-item.is-active .dot { transform: scale(1); }
  .nav-item.is-active .label { color: var(--ink); transform: translateX(4px); }
  .none-active .nav-item .label { color: var(--ink); }
  .contact-item .label { color: var(--ink); }
  .contact-item:hover .dot, .contact-item:focus-visible .dot { transform: scale(1); }
  .none-active .nav-item:hover .label { transform: translateX(4px); }
  @media (hover: none) { .nav-item .label { color: var(--ink); } }

  .exp-row .exp-dot { transform: scale(0); transition: transform .25s cubic-bezier(.3,1.5,.5,1); }
  .exp-row.is-active .exp-dot { transform: scale(1); }
  .exp-row { color: color-mix(in srgb, var(--ink) 55%, transparent); transition: color .2s; }
  .exp-row.is-active, .exp-row:hover { color: var(--ink); }
  .exp-row:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .pager { width: 36px; height: 36px; border: 1.5px solid var(--ink); border-radius: 999px; display: grid; place-items: center; }
  .pager:disabled { opacity: .3; cursor: default; }
  .case { transition: background-color .2s, color .2s; }
  .case:hover { background: var(--ink); color: var(--paper); }
  .case:hover .tag, .case:hover .text-ink\/60, .case:hover .text-ink\/70 { color: color-mix(in srgb, var(--paper) 75%, transparent); }
  .case:hover .rounded-full { border-color: var(--paper); }
  .case:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .card:hover .ph-img { filter: brightness(.93); }
  .card .ph-img { transition: filter .2s; }
  .preview-card:hover { filter: brightness(.97); }
  .nav-btn:focus-visible, .nav-item:focus-visible, .card:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }


  /* BD grid: rows are at least as tall as their content, otherwise share the space */
  .bd-grid { grid-auto-rows: minmax(max-content, 1fr); }

  /* Very short screens (landscape phones, small laptops with toolbars): the screen scrolls as a
     whole instead of squeezing panels, so nothing is ever cut off. */
  /* Phones and very short screens: the whole screen scrolls like a page, never a box inside a box */
  @media (max-height: 560px), (max-width: 639px) {
    .view-enter { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .view-enter > div { height: auto !important; min-height: 100%; }
    .view-enter .flex-1 { flex: none !important; }
    .view-enter .min-h-0 { min-height: auto !important; }
    .view-enter .h-full { height: auto !important; }
    .view-enter [class*="overflow-hidden"], .view-enter [class*="overflow-y-auto"] { overflow: visible !important; }
    .view-enter figure { min-height: 300px; }
    .view-enter figure img { min-height: 300px; }
    .bd-grid { grid-auto-rows: auto; }
    .view-enter .egg-panel { overflow-y: auto !important; max-height: 100%; }
  }


  /* Easter egg */
  .egg { animation: fadeIn .2s ease both; }
  .egg-panel { animation: eggIn .35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes eggIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  .juju-btn img { transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .juju-btn:hover img { transform: rotate(-4deg) scale(1.03); }
  .juju-btn:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .egg, .egg-panel { animation: none; } .juju-btn img { transition: none; } .juju-btn:hover img { transform: none; } }
  .back-btn:focus-visible, .lnk:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .view-enter, .preview-in { animation: none; }
    .nav-item .dot, .nav-item .label, .exp-row, .exp-row .exp-dot { transition: none; }
  }
</style>

<script>
const { useEffect, useRef, useState, useCallback } = React;
const html = htm.bind(React.createElement);

/* =====================================================================
   Solar system: the landing page and the main navigation.
   Rendered on one 2D canvas. Every body is a small sphere-mapped bitmap:
   a procedural texture is wrapped onto a sphere through a precomputed
   lookup table, lit from the sun's direction and redrawn each frame.
   ===================================================================== */

const prefersReduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const approach = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-dt * rate));
const wide = () => window.matchMedia('(min-width: 768px)').matches;
const pad2 = (n) => String(n).padStart(2, '0');

/* ---------- Procedural noise (tileable on the horizontal axis) ---------- */
function hash(ix, iy, seed) {
  const s = Math.sin(ix * 127.1 + iy * 311.7 + seed * 74.7) * 43758.5453;
  return s - Math.floor(s);
}
function vnoise(x, y, period, seed) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const x0 = ((ix % period) + period) % period, x1 = (x0 + 1) % period;
  const a = hash(x0, iy, seed), b = hash(x1, iy, seed), c = hash(x0, iy + 1, seed), d = hash(x1, iy + 1, seed);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm(u, v, oct, base, seed) {
  let sum = 0, amp = 0.5, norm = 0, f = base;
  for (let o = 0; o < oct; o++) {
    sum += amp * vnoise(u * f, v * f * 0.5, f, seed + o * 13);
    norm += amp; amp *= 0.5; f *= 2;
  }
  return sum / norm;
}
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function ramp(stops, t) {
  t = clamp01(t);
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
      return mix(c0, c1, (t - t0) / (t1 - t0));
    }
  }
  return stops[stops.length - 1][1];
}

/* Builds an RGB texture TW × TH from fn(u, v) → [r, g, b] */
const TW = 256, TH = 128;
function makeTexture(fn) {
  const out = new Uint8ClampedArray(TW * TH * 3);
  for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
    const c = fn(x / TW, y / TH), o = (y * TW + x) * 3;
    out[o] = c[0]; out[o + 1] = c[1]; out[o + 2] = c[2];
  }
  return out;
}

/* ---------- Textures, one per body ---------- */
const TEX = {
  // Portfolio: pale gold ringed planet with soft bands
  ringed: () => makeTexture((u, v) => {
    const warp = fbm(u, v, 4, 4, 11) * 0.06;
    const b = Math.sin((v + warp) * Math.PI * 16) * 0.5 + 0.5;
    const fine = fbm(u, v, 3, 24, 12);
    return ramp([[0, hex('#8a6a3c')], [0.45, hex('#c9a66b')], [0.8, hex('#e9d5a6')], [1, hex('#f6ead0')]], b * 0.7 + fine * 0.3);
  }),
  // Experience: banded gas giant with turbulent belts and a storm
  giant: () => makeTexture((u, v) => {
    const warp = (fbm(u, v, 5, 6, 21) - 0.5) * 0.09;
    const lat = v + warp;
    const bands = Math.sin(lat * Math.PI * 11) * 0.5 + 0.5;
    const swirl = fbm(u + lat * 0.3, v, 4, 18, 22);
    let c = ramp([[0, hex('#5e3020')], [0.35, hex('#a35a32')], [0.6, hex('#d8a06a')], [0.85, hex('#ecd3ac')], [1, hex('#f4e6cc')]], bands * 0.75 + swirl * 0.25);
    const du = Math.min(Math.abs(u - 0.32), 1 - Math.abs(u - 0.32)) * 2.2, dv = (v - 0.64) * 4.2;
    const spot = Math.exp(-(du * du + dv * dv) * 6);
    return mix(c, hex('#b4462a'), spot * 0.85);
  }),
  // About: blue planet with continents, clouds and ice caps
  blue: () => makeTexture((u, v) => {
    const land = fbm(u, v, 6, 4, 31);
    const cloud = fbm(u, v, 5, 6, 33);
    const pole = Math.abs(v - 0.5) * 2;
    let c = ramp([[0, hex('#0b2246')], [0.5, hex('#163f7a')], [1, hex('#2f6fb3')]], land * 1.4 - 0.2);
    if (land > 0.56) c = ramp([[0, hex('#4f6b3a')], [0.5, hex('#7d8a4e')], [1, hex('#b39a6b')]], (land - 0.56) * 4);
    if (pole > 0.86) c = mix(c, hex('#eef3f6'), clamp01((pole - 0.86) * 9));
    return mix(c, hex('#f4f7fa'), clamp01((cloud - 0.55) * 3.2) * 0.85);
  }),
  // Contact: small red, cratered rocky world
  rocky: () => makeTexture((u, v) => {
    const n = fbm(u, v, 6, 6, 41);
    const crater = fbm(u, v, 2, 20, 42);
    return ramp([[0, hex('#3d1d14')], [0.4, hex('#7a3b25')], [0.7, hex('#b9653b')], [1, hex('#e0a174')]], n * 1.2 - 0.1 - Math.max(0, crater - 0.62) * 1.6);
  }),
  // Small grey inner world (decorative)
  grey: () => makeTexture((u, v) => {
    const n = fbm(u, v, 6, 8, 51);
    return ramp([[0, hex('#2c2a28')], [0.5, hex('#6d6863')], [1, hex('#b8b1a8')]], n * 1.3 - 0.15);
  }),
};

/* Sun: two scalar noise layers combined every frame for a moving plasma */
const SUN_TW = 512, SUN_TH = 256;
function makeSunLayers() {
  const a = new Float32Array(SUN_TW * SUN_TH), b = new Float32Array(SUN_TW * SUN_TH);
  for (let y = 0; y < SUN_TH; y++) for (let x = 0; x < SUN_TW; x++) {
    const u = x / SUN_TW, v = y / SUN_TH, i = y * SUN_TW + x;
    a[i] = fbm(u, v, 5, 8, 61);
    b[i] = fbm(u, v, 4, 30, 67);
  }
  return { a, b };
}
const SUN_RAMP = (() => {
  const r = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const c = ramp([[0, hex('#7a1d02')], [0.3, hex('#d84a07')], [0.55, hex('#f7930f')], [0.78, hex('#ffd04a')], [1, hex('#fff6d8')]], i / 255);
    r[i * 3] = c[0]; r[i * 3 + 1] = c[1]; r[i * 3 + 2] = c[2];
  }
  return r;
})();

/* ---------- Sphere lookup tables ---------- */
/* For a disc of diameter D device pixels: which pixels are inside, their longitude/latitude
   on the sphere, their surface normal, and an anti-aliased edge alpha. */
function makeSphere(D) {
  const idx = [], u0 = [], vv = [], nx = [], ny = [], nz = [], al = [];
  const R = D / 2;
  for (let y = 0; y < D; y++) for (let x = 0; x < D; x++) {
    const px = (x + 0.5 - R) / R, py = (y + 0.5 - R) / R;
    const d2 = px * px + py * py;
    if (d2 > 1.02) continue;
    const d = Math.sqrt(d2);
    const z = Math.sqrt(Math.max(0, 1 - Math.min(1, d2)));
    idx.push(y * D + x);
    u0.push(Math.atan2(px, z) / (Math.PI * 2));
    vv.push(Math.acos(clamp(py, -1, 1)) / Math.PI);
    nx.push(px); ny.push(py); nz.push(z);
    al.push(clamp01((1 - d) * R + 0.5));
  }
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = D;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(D, D);
  return { D, canvas, ctx, img, n: idx.length,
    idx: Int32Array.from(idx), u0: Float32Array.from(u0), v: Float32Array.from(vv),
    nx: Float32Array.from(nx), ny: Float32Array.from(ny), nz: Float32Array.from(nz), al: Float32Array.from(al) };
}

/* Paint a lit planet into its sphere bitmap. L = light direction (screen space, z toward viewer). */
function paintPlanet(S, tex, rot, Lx, Ly, Lz, amb) {
  const d = S.img.data;
  for (let k = 0; k < S.n; k++) {
    let tu = ((S.u0[k] + rot) * TW) | 0;
    tu = ((tu % TW) + TW) % TW;
    const tv = Math.min(TH - 1, (S.v[k] * TH) | 0);
    const t = (tv * TW + tu) * 3;
    const lam = S.nx[k] * Lx + S.ny[k] * Ly + S.nz[k] * Lz;
    const sh = amb + (1 - amb) * (lam > 0 ? Math.pow(lam, 0.9) : 0);
    const o = S.idx[k] * 4;
    d[o] = tex[t] * sh; d[o + 1] = tex[t + 1] * sh; d[o + 2] = tex[t + 2] * sh;
    d[o + 3] = 255 * S.al[k];
  }
  S.ctx.putImageData(S.img, 0, 0);
}

/* Paint the sun: two noise layers rotating at different speeds, limb darkening, hot core */
function paintSun(S, L, ra, rb, pulse) {
  const d = S.img.data;
  for (let k = 0; k < S.n; k++) {
    const v = Math.min(SUN_TH - 1, (S.v[k] * SUN_TH) | 0);
    let ua = ((S.u0[k] + ra) * SUN_TW) | 0; ua = ((ua % SUN_TW) + SUN_TW) % SUN_TW;
    let ub = ((S.u0[k] * 1.0 + rb) * SUN_TW) | 0; ub = ((ub % SUN_TW) + SUN_TW) % SUN_TW;
    const z = S.nz[k];
    const plasma = L.a[v * SUN_TW + ua] * 0.62 + L.b[v * SUN_TW + ub] * 0.38;
    const heat = clamp01((plasma - 0.28) * 1.45 + pulse) * (0.5 + 0.5 * z) + z * 0.32;
    const c = Math.min(255, (heat * 255) | 0) * 3;
    const o = S.idx[k] * 4;
    d[o] = SUN_RAMP[c]; d[o + 1] = SUN_RAMP[c + 1]; d[o + 2] = SUN_RAMP[c + 2];
    d[o + 3] = 255 * S.al[k];
  }
  S.ctx.putImageData(S.img, 0, 0);
}

/* ---------- The system ---------- */
/* orbit: fraction of the outermost orbit. speed: radians per second (sign = direction).
   key: the section this planet opens; null = decorative. */
const BODIES = [
  { key: null,         label: '',           tex: 'grey',   size: 8,  orbit: 0.23, speed: 0.17,  phase: 2.4, spin: 0.020, desktopOnly: true, orbitAlpha: 0.06 },
  { key: 'about',      label: 'About',      tex: 'blue',   size: 21, orbit: 0.39, speed: 0.105, phase: 0.6, spin: 0.030, atmo: '120,180,255', orbitAlpha: 0.12,
    moons: [{ r: 2.1, dist: 2.0, speed: 0.9, phase: 1, tint: '#cfcac2' }] },
  { key: 'contact',    label: 'Contact',    tex: 'rocky',  size: 13, orbit: 0.54, speed: -0.08, phase: 3.7, spin: 0.018, orbitAlpha: 0.07 },
  { key: 'experience', label: 'Experience', tex: 'giant',  size: 38, orbit: 0.74, speed: 0.058, phase: 5.0, spin: 0.012, orbitAlpha: 0.10,
    moons: [{ r: 3.6, dist: 1.75, speed: 0.55, phase: 0.4, tint: '#d9d2c4' }, { r: 2.4, dist: 2.35, speed: -0.38, phase: 3.1, tint: '#b8a48c' }] },
  { key: 'portfolio',  label: 'Portfolio',  tex: 'ringed', size: 27, orbit: 0.96, speed: 0.042, phase: 1.9, spin: 0.016, ring: true, orbitAlpha: 0.08,
    moons: [{ r: 2.6, dist: 2.6, speed: 0.42, phase: 4.2, tint: '#cfc6b6' }] },
];
const SECTIONS = BODIES.filter((b) => b.key);
const SUN_SIZE = 74;

function SolarSystem({ api, onEnter, hidden }) {
  const canvasRef = useRef(null);
  const btnRefs = useRef({});

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const reduced = prefersReduced();

    /* textures (built once) */
    const { tex, sunLayers } = getTextures();

    /* state */
    const S = {
      w: 0, h: 0, dpr: 1, R: 300, tilt: 0.42, portrait: false, scale: 1,
      time: 0, spin: 0, spinVel: 0,
      px: 0, py: 0, hasPointer: false, pointerType: 'mouse',
      parX: 0, parY: 0,
      hovered: null, kbFocus: null, selected: null,
      down: null, dragging: false,
      travel: null,            // { body, p, dir, start, focus:{x,y}, zEnd, fired }
      cam: { fx: 0, fy: 0, z: 1, fade: 0 },
      intro: 0,
      paused: false,
      sunSphere: null,
      sunBody: { key: 'index', label: 'Enter site', size: SUN_SIZE, orbit: 0, angle: 0, moons: [], hov: 0, screen: null },
      bodies: BODIES.map((b, i) => ({ ...b, i, angle: b.phase, rot: Math.random(), hov: 0, speedMul: 1, sphere: null, screen: null, moons: (b.moons || []).map((m) => ({ ...m, angle: m.phase })) })),
    };
    const stars = [];

    function layout() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      S.w = w; S.h = h; S.dpr = dpr;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      S.portrait = h > w * 1.1;
      S.scale = clamp(Math.min(w, h) / 860, 0.62, 1.15);
      S.pscale = S.portrait ? clamp(w / 400, 0.85, 1.05) : S.scale; // planets stay tappable on phones
      if (S.portrait) {
        // major axis runs down the screen on phones
        S.R = Math.min(h * 0.43, 420);
        S.tilt = clamp((w * 0.45) / S.R, 0.4, 1);
      } else {
        S.R = Math.min(w * 0.46, (h * 0.44) / 0.42, 780);
        S.tilt = 0.42;
      }
      // sphere bitmaps sized to the device pixels they will cover (with room for hover/zoom)
      const sunD = Math.ceil(SUN_SIZE * S.scale * 2 * dpr * 1.1);
      S.sunSphere = makeSphere(sunD);
      S.bodies.forEach((b) => { b.sphere = makeSphere(Math.ceil(b.size * S.pscale * 2 * dpr * 1.25)); });
      // stars
      stars.length = 0;
      const count = Math.round(clamp((w * h) / 7000, 70, 240));
      for (let i = 0; i < count; i++) {
        const bright = Math.random() < 0.07;
        stars.push({ x: Math.random() * w, y: Math.random() * h, r: bright ? 0.9 + Math.random() * 0.8 : 0.3 + Math.random() * 0.6,
          a: bright ? 0.7 + Math.random() * 0.3 : 0.15 + Math.random() * 0.4, depth: 0.15 + Math.random() * 0.5,
          tw: 0.4 + Math.random() * 1.6, ph: Math.random() * 6.28, bright, warm: Math.random() < 0.3 });
      }
    }

    /* world position of a body (sun at 0,0), depth = how far toward the viewer (−1 back … 1 front) */
    function orbitPos(orbit, angle) {
      const r = orbit * S.R;
      const c = Math.cos(angle), s = Math.sin(angle);
      return S.portrait ? { x: s * r * S.tilt, y: -c * r, depth: -c } : { x: c * r, y: s * r * S.tilt, depth: s };
    }
    function bodyVisible(b) { return !(b.desktopOnly && S.portrait); }

    /* screen transform: camera focus + zoom + pointer parallax */
    function toScreen(x, y, par = 1) {
      const z = S.cam.z;
      return { x: S.w / 2 + (x - S.cam.fx) * z + S.parX * par, y: S.h / 2 + (y - S.cam.fy) * z + S.parY * par };
    }

    /* ---------- input ---------- */
    function hitTest(x, y) {
      let best = null, bestD = Infinity;
      for (const b of S.bodies) {
        if (!b.key || !b.screen || !bodyVisible(b)) continue;
        const d = Math.hypot(x - b.screen.x, y - b.screen.y);
        const reach = Math.max(b.screen.r + 14, 28);
        if (d < reach && d < bestD) { best = b; bestD = d; }
      }
      const sb = S.sunBody;
      if (!best && sb.screen && Math.hypot(x - sb.screen.x, y - sb.screen.y) < sb.screen.r + 8) best = sb;
      return best;
    }
    const local = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    function onMove(e) {
      const p = local(e);
      S.px = p.x; S.py = p.y; S.hasPointer = true; S.pointerType = e.pointerType;
      if (S.down) {
        const dx = p.x - S.down.x;
        if (!S.dragging && Math.abs(dx) + Math.abs(p.y - S.down.y) > 7) S.dragging = true;
        if (S.dragging && !reduced) {
          const step = (p.x - S.down.lx) * 0.004;
          S.spin += step; S.spinVel = step / Math.max(0.016, (e.timeStamp - S.down.lt) / 1000);
          S.down.lx = p.x; S.down.lt = e.timeStamp;
        }
      }
    }
    function onDown(e) {
      if (S.travel) return;
      const p = local(e);
      S.down = { x: p.x, y: p.y, lx: p.x, lt: e.timeStamp };
      S.dragging = false; S.spinVel = 0;
      canvas.setPointerCapture?.(e.pointerId);
    }
    function onUp(e) {
      const wasDrag = S.dragging;
      S.down = null; S.dragging = false;
      if (wasDrag || S.travel) return;
      const p = local(e);
      const hit = hitTest(p.x, p.y);
      if (e.pointerType === 'mouse') { if (hit) enter(hit); return; }
      // touch: first tap reveals the label, second tap on the same planet travels to it
      if (hit && S.selected === hit.key) enter(hit);
      else S.selected = hit ? hit.key : null;
    }
    function onLeave(e) { if (e.pointerType === 'mouse') S.hasPointer = false; }

    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointerleave', onLeave);
    canvas.addEventListener('pointercancel', () => { S.down = null; S.dragging = false; });

    /* ---------- travel ---------- */
    function enter(b) {
      if (S.travel) return;
      const isSun = b === S.sunBody;
      const wp = isSun ? { x: 0, y: 0 } : orbitPos(b.orbit, b.angle + S.spin);
      const r = b.size * S.pscale;
      S.selected = null;
      S.travel = { body: b, p: 0, dir: 1, start: performance.now(), focus: wp, zEnd: Math.max(1.6, (Math.min(S.w, S.h) * (isSun ? 0.26 : 0.17)) / r), fired: false };
      if (reduced) { S.travel.p = 1; }
    }
    api.current = {
      setPaused: (v) => { S.paused = v; },
      focus: (key) => { S.kbFocus = key; },
      enter: (key) => { const b = key === 'index' ? S.sunBody : S.bodies.find((x) => x.key === key); if (b) enter(b); },
      // called when the section has closed back into the planet
      returnToOrbit: () => {
        S.paused = false;
        if (!S.travel) return;
        S.travel.dir = -1; S.travel.start = performance.now();
        if (reduced) { S.travel = null; S.cam = { fx: 0, fy: 0, z: 1, fade: 0 }; }
      },
      // where the selected planet sits on screen right now (for the reveal circle)
      target: () => {
        const b = S.travel?.body; if (!b || !b.screen) return { x: S.w / 2, y: S.h / 2, r: 40 };
        return { x: b.screen.x, y: b.screen.y, r: b.screen.r };
      },
    };

    /* ---------- drawing helpers ---------- */
    function drawGlow(x, y, r, inner, outer, color, alpha) {
      const g = ctx.createRadialGradient(x, y, r * inner, x, y, r * outer);
      g.addColorStop(0, `rgba(${color},${alpha})`);
      g.addColorStop(0.35, `rgba(${color},${alpha * 0.35})`);
      g.addColorStop(1, `rgba(${color},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * outer, 0, Math.PI * 2); ctx.fill();
    }
    function ringPath(x, y, rx, ry, rot, start, end) {
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, start, end);
    }
    function drawRing(x, y, r, half, alpha) {
      // half: 'back' draws the far side (behind the planet), 'front' the near side
      const ry = S.portrait ? 0.32 : 0.3, rot = S.portrait ? -0.5 : -0.32;
      const [a0, a1] = half === 'back' ? [Math.PI, Math.PI * 2] : [0, Math.PI];
      const bands = [[1.42, 2.2, 0.20], [1.62, 3.4, 0.42], [1.86, 2.2, 0.30], [2.02, 1.2, 0.18], [2.16, 0.8, 0.12]];
      for (const [k, wdt, a] of bands) {
        ctx.strokeStyle = `rgba(232,214,170,${a * alpha})`;
        ctx.lineWidth = wdt * (r / 27);
        ringPath(x, y, r * k, r * k * ry, rot, a0, a1); ctx.stroke();
      }
    }
    function drawMoon(m, x, y, sunX, sunY, alpha) {
      const r = m.r * S.pscale;
      const dx = sunX - x, dy = sunY - y, dl = Math.hypot(dx, dy) || 1;
      const g = ctx.createRadialGradient(x + (dx / dl) * r * 0.5, y + (dy / dl) * r * 0.5, r * 0.1, x, y, r * 1.05);
      g.addColorStop(0, m.tint); g.addColorStop(0.7, '#3b3733'); g.addColorStop(1, '#141210');
      ctx.globalAlpha = alpha; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    /* Labels never sit on top of each other: each one checks the boxes already placed this
       frame and moves to the other side, then steps down, until it is clear. */
    let placed = [];
    function drawLabel(b, alpha, hint) {
      if (alpha < 0.02 || !b.screen) return;
      const { x, y, r } = b.screen;
      ctx.font = '400 11px "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif';
      if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
      const tw = ctx.measureText(b.label.toUpperCase()).width + (hint ? 40 : 0);
      const boxFor = (right, dy) => {
        const sx = right ? 1 : -1, ax = x + sx * (r * 0.75), ay = y - r * 0.75 + dy, bx = ax + sx * 18, by = ay - 18;
        const x0 = right ? bx : bx - 34 - tw, x1 = right ? bx + 34 + tw : bx;
        return { right, sx, ax, ay, bx, by, x0, x1, y0: by - 9, y1: by + (hint ? 24 : 9) };
      };
      const hits = (bx) => placed.some((p) => bx.x0 < p.x1 && bx.x1 > p.x0 && bx.y0 < p.y1 && bx.y1 > p.y0)
        || bx.x0 < 4 || bx.x1 > S.w - 4;
      const pref = x < S.w - 150;
      let box = null;
      for (const dy of [0, 22, -22, 44, -44, 66]) {
        for (const side of [pref, !pref]) { const c = boxFor(side, dy); if (!hits(c)) { box = c; break; } }
        if (box) break;
      }
      box = box || boxFor(pref, 0);
      placed.push(box);
      const { right, sx, ax, ay, bx, by } = box;
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(bx + sx * 14, by); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.textAlign = right ? 'left' : 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(b.label.toUpperCase(), bx + sx * 20, by);
      if (hint) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '400 10px "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif';
        ctx.fillText('TAP AGAIN TO ENTER', bx + sx * 20, by + 15);
      }
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.globalAlpha = 1;
    }

    /* ---------- frame ---------- */
    let raf, last = performance.now();
    const t0 = performance.now();
    function frame(now) {
      raf = requestAnimationFrame(frame);
      if (document.hidden || S.paused) { last = now; return; }
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const T = (now - t0) / 1000;

      /* travel progress */
      const tr = S.travel;
      if (tr) {
        const dur = tr.dir > 0 ? 950 : 800;
        const k = reduced ? 1 : clamp01((now - tr.start) / dur);
        tr.p = tr.dir > 0 ? Math.max(tr.p, k) : Math.min(tr.p, 1 - k);
        if (tr.dir > 0 && tr.p >= (reduced ? 1 : 0.62) && !tr.fired) { tr.fired = true; onEnter(tr.body.key); }
        if (tr.dir > 0 && tr.p >= 1 && tr.fired) { /* stay zoomed; App pauses us once the section covers the screen */ }
        if (tr.dir < 0 && tr.p <= 0) S.travel = null;
      }
      const tp = S.travel ? S.travel.p : 0;
      const frozen = !!S.travel || reduced;

      /* time, drag inertia */
      if (!frozen) {
        S.spinVel = S.down ? S.spinVel : S.spinVel * Math.exp(-dt * 2.2);
        if (!S.down) S.spin += S.spinVel * dt;
      }

      /* camera */
      if (S.travel) {
        const f = easeOut(clamp01(tp / 0.7)), z = easeInOut(tp);
        S.cam.fx = S.travel.focus.x * f; S.cam.fy = S.travel.focus.y * f;
        S.cam.z = Math.pow(S.travel.zEnd, z);
        S.cam.fade = tp;
      } else { S.cam.fx = 0; S.cam.fy = 0; S.cam.z = 1; S.cam.fade = 0; }
      const nx = S.hasPointer && S.pointerType === 'mouse' ? (S.px / S.w - 0.5) * 2 : 0;
      const ny = S.hasPointer && S.pointerType === 'mouse' ? (S.py / S.h - 0.5) * 2 : 0;
      const parAmt = reduced || S.travel ? 0 : 1;
      S.parX = approach(S.parX, -nx * 16 * parAmt, 2.5, dt);
      S.parY = approach(S.parY, -ny * 10 * parAmt, 2.5, dt);

      /* hover target */
      let hovered = null;
      if (!S.travel) {
        if (S.kbFocus) hovered = S.kbFocus === 'index' ? S.sunBody : S.bodies.find((b) => b.key === S.kbFocus) || null;
        else if (S.hasPointer && S.pointerType === 'mouse' && !S.dragging) hovered = hitTest(S.px, S.py);
        else if (S.selected) hovered = S.selected === 'index' ? S.sunBody : S.bodies.find((b) => b.key === S.selected) || null;
      }
      S.hovered = hovered;
      canvas.style.cursor = S.dragging ? 'grabbing' : hovered && !S.kbFocus ? 'pointer' : 'grab';
      S.intro = reduced ? 0 : clamp01(1 - (T - 2.6) / 1.4); // all labels show briefly on arrival

      /* advance bodies */
      for (const b of S.bodies) {
        b.hov = approach(b.hov, b === hovered ? 1 : 0, b === hovered ? 9 : 5, dt);
        b.speedMul = approach(b.speedMul, b === hovered ? 0.25 : 1, 3, dt);
        if (!frozen) {
          b.angle += b.speed * b.speedMul * dt;
          b.rot += b.spin * dt;
          for (const m of b.moons) m.angle += m.speed * dt;
        }
      }

      const ctxW = S.w, ctxH = S.h;
      ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
      ctx.fillStyle = '#04050a';
      ctx.fillRect(0, 0, ctxW, ctxH);

      /* stars: tiny parallax, slow twinkle, drift outward while travelling */
      const starFade = 1 - S.cam.fade * 0.5;
      for (const s of stars) {
        const tw = reduced ? 1 : 0.75 + 0.25 * Math.sin(T * s.tw + s.ph);
        const spread = 1 + (S.cam.z - 1) * 0.04 * s.depth;
        const x = ctxW / 2 + (s.x - ctxW / 2) * spread + S.parX * s.depth;
        const y = ctxH / 2 + (s.y - ctxH / 2) * spread + S.parY * s.depth;
        const a = s.a * tw * starFade;
        ctx.fillStyle = s.warm ? `rgba(255,226,196,${a})` : `rgba(226,234,255,${a})`;
        ctx.beginPath(); ctx.arc(x, y, s.r, 0, Math.PI * 2); ctx.fill();
        if (s.bright) {
          ctx.fillStyle = `rgba(220,230,255,${a * 0.12})`;
          ctx.beginPath(); ctx.arc(x, y, s.r * 4, 0, Math.PI * 2); ctx.fill();
        }
      }

      /* positions */
      const sb = S.sunBody;
      sb.hov = approach(sb.hov, sb === hovered ? 1 : 0, sb === hovered ? 7 : 4, dt);
      const sun = toScreen(0, 0);
      const sunR = SUN_SIZE * S.scale * S.cam.z * (1 + sb.hov * 0.05);
      sb.screen = { x: sun.x, y: sun.y, r: sunR, depth: 0 };
      const items = [];
      for (const b of S.bodies) {
        if (!bodyVisible(b)) { b.screen = null; continue; }
        const wp = orbitPos(b.orbit, b.angle + S.spin);
        const sp = toScreen(wp.x, wp.y, 1 + wp.depth * 0.25);
        const r = b.size * S.pscale * (1 + wp.depth * 0.06) * (1 + b.hov * 0.12) * S.cam.z;
        b.screen = { x: sp.x, y: sp.y, r, depth: wp.depth };
        items.push({ kind: 'planet', b, depth: wp.depth });
      }
      items.push({ kind: 'sun', depth: 0 });
      items.sort((a, c) => a.depth - c.depth);

      /* orbits: very faint, each its own weight; the hovered planet's orbit brightens */
      const others = 1 - S.cam.fade * 0.92;
      for (const b of S.bodies) {
        if (!bodyVisible(b)) continue;
        const r = b.orbit * S.R * S.cam.z;
        const rx = S.portrait ? r * S.tilt : r, ry = S.portrait ? r : r * S.tilt;
        ctx.strokeStyle = `rgba(255,236,210,${(b.orbitAlpha + b.hov * 0.14) * others})`;
        ctx.lineWidth = b.key === 'portfolio' ? 1 : 0.8;
        ctx.setLineDash(b.key === 'contact' ? [2, 6] : []);
        ctx.beginPath(); ctx.ellipse(sun.x, sun.y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.setLineDash([]);

      /* sun corona (behind everything that orbits) */
      ctx.globalCompositeOperation = 'lighter';
      const sunFade = S.travel && S.travel.body !== sb ? others : 1;
      drawGlow(sun.x, sun.y, sunR, 0.6, 5.2, '255,120,30', (0.16 + sb.hov * 0.06) * sunFade);
      drawGlow(sun.x, sun.y, sunR, 0.9, 2.1, '255,170,60', (0.30 + sb.hov * 0.12) * sunFade);
      ctx.globalCompositeOperation = 'source-over';

      /* bodies, back to front */
      const ra = reduced ? 0 : T * 0.006, rb = reduced ? 0 : -T * 0.011;
      for (const it of items) {
        if (it.kind === 'sun') {
          paintSun(S.sunSphere, sunLayers, ra, rb, reduced ? 0 : Math.sin(T * 0.7) * 0.025);
          ctx.globalAlpha = sunFade;
          ctx.drawImage(S.sunSphere.canvas, sun.x - sunR, sun.y - sunR, sunR * 2, sunR * 2);
          ctx.globalAlpha = 1;
          continue;
        }
        const b = it.b, { x, y, r } = b.screen;
        const isTarget = S.travel && S.travel.body === b;
        const toSun = S.travel && S.travel.body === sb;
        const alpha = isTarget ? 1 : toSun ? 1 - S.cam.fade : others;
        if (alpha < 0.01) continue;
        // light: from planet toward the sun; planets in front of the sun show more night side
        let lx = sun.x - x, ly = sun.y - y; const ll = Math.hypot(lx, ly) || 1;
        const lz = -it.depth * 0.75;
        const lxy = Math.sqrt(Math.max(0, 1 - lz * lz));
        lx = (lx / ll) * lxy; ly = (ly / ll) * lxy;

        // moons behind the planet
        const moonPts = b.moons.map((m) => {
          const md = m.dist * b.size * S.pscale * S.cam.z;
          const c = Math.cos(m.angle), s = Math.sin(m.angle);
          return { m, x: x + c * md, y: y + s * md * 0.38, front: s > 0 };
        });
        for (const mp of moonPts) if (!mp.front) drawMoon(mp.m, mp.x, mp.y, sun.x, sun.y, alpha);

        ctx.globalAlpha = alpha;
        if (b.ring) drawRing(x, y, r, 'back', 1);
        paintPlanet(b.sphere, tex[b.tex], b.rot, lx, ly, lz, b.atmo ? 0.07 : 0.05);
        ctx.drawImage(b.sphere.canvas, x - r, y - r, r * 2, r * 2);
        if (b.atmo) {
          ctx.globalCompositeOperation = 'lighter';
          const g = ctx.createRadialGradient(x, y, r * 0.86, x, y, r * 1.22);
          g.addColorStop(0, `rgba(${b.atmo},0)`); g.addColorStop(0.45, `rgba(${b.atmo},0.22)`); g.addColorStop(1, `rgba(${b.atmo},0)`);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.22, 0, Math.PI * 2); ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        }
        if (b.ring) drawRing(x, y, r, 'front', 1);
        // hover: a fine halo
        if (b.hov > 0.01) {
          ctx.globalCompositeOperation = 'lighter';
          drawGlow(x, y, r, 0.95, 1.7, b.atmo || '255,214,170', 0.16 * b.hov);
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = `rgba(255,255,255,${0.32 * b.hov})`; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(x, y, r + 7, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        for (const mp of moonPts) if (mp.front) drawMoon(mp.m, mp.x, mp.y, sun.x, sun.y, alpha);
      }

      /* labels last, so they sit above everything */
      if (!S.travel) {
        placed = [];
        drawLabel(sb, Math.max(sb.hov, S.intro * 0.75), S.pointerType !== 'mouse' && S.selected === 'index' && sb.hov > 0.5);
        for (const b of S.bodies) {
          if (!b.key || !b.screen) continue;
          const a = Math.max(b.hov, S.intro * 0.75);
          drawLabel(b, a, S.pointerType !== 'mouse' && S.selected === b.key && b.hov > 0.5);
        }
      }
    }

    layout();
    const ro = new ResizeObserver(() => layout());
    ro.observe(canvas);
    raf = requestAnimationFrame(frame);
    return () => {
      cancelAnimationFrame(raf); ro.disconnect();
      canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerdown', onDown);
      canvas.removeEventListener('pointerup', onUp);
      canvas.removeEventListener('pointerleave', onLeave);
    };
  }, []);

  // App pauses rendering while a section covers the screen
  useEffect(() => { api.current?.setPaused(hidden); }, [hidden]);

  return html`
    <div className="absolute inset-0">
      <canvas ref=${canvasRef} className="absolute inset-0 w-full h-full block" style=${{ touchAction: 'none' }} aria-hidden="true"></canvas>
      <!-- Keyboard and screen-reader access to the planets -->
      <nav aria-label="Portfolio sections" className="sr-only">
        <ul>
          <li><button type="button" onFocus=${() => api.current?.focus('index')} onBlur=${() => api.current?.focus(null)}
            onClick=${() => api.current?.enter('index')}>Enter site</button></li>
          ${SECTIONS.map((b) => html`
            <li key=${b.key}>
              <button type="button" ref=${(el) => (btnRefs.current[b.key] = el)}
                onFocus=${() => api.current?.focus(b.key)} onBlur=${() => api.current?.focus(null)}
                onClick=${() => api.current?.enter(b.key)}>${b.label}</button>
            </li>`)}

/* ---- Contact: a line-drawn orrery. Ink only, tilted orbits, planets travelling in real time ---- */
const ORRERY = {
  cx: 200, cy: 200, tilt: -22, flat: 0.44, sunR: 30,
  // a = orbit radius, r = planet size, dash = dotted orbit, w = orbit line weight
  planets: [
    { name: 'Mercury', a: 46,  r: 2.0, w: 0.8 },
    { name: 'Venus',   a: 62,  r: 3.1, w: 0.8, dash: '1 3' },
    { name: 'Earth',   a: 80,  r: 3.4, w: 1.0, moon: true },
    { name: 'Mars',    a: 98,  r: 2.6, w: 0.8 },
    { name: 'Jupiter', a: 132, r: 7.0, w: 1.2 },
    { name: 'Saturn',  a: 154, r: 5.4, w: 1.0, ring: true },
    { name: 'Uranus',  a: 174, r: 4.2, w: 0.8, dash: '1 3' },
    { name: 'Neptune', a: 192, r: 4.0, w: 1.4 },
  ],
  belt: { a: 114, spread: 5, count: 90 },
};
// Kepler-ish: outer planets are slower. Starting angles spread around the ellipse.
ORRERY.planets.forEach((p, i) => { p.speed = 0.9 * Math.pow(46 / p.a, 1.5); p.start = (i * 2.399) % (Math.PI * 2); });
const BELT = Array.from({ length: ORRERY.belt.count }, (_, i) => ({
  t: (i / ORRERY.belt.count) * Math.PI * 2 + Math.sin(i * 12.9898) * 0.05,
  da: Math.sin(i * 78.233) * ORRERY.belt.spread, r: 0.45 + ((i * 7) % 5) * 0.12,
}));

function orreryPoint(a, t) {
  const { cx, cy, tilt, flat } = ORRERY;
  const x = Math.cos(t) * a, y = Math.sin(t) * a * flat;
  const k = (tilt * Math.PI) / 180, c = Math.cos(k), s = Math.sin(k);
  return { x: cx + x * c - y * s, y: cy + x * s + y * c, front: Math.sin(t) };
}

function ArtSystem() {
  const pRefs = useRef([]), moonRef = useRef(null), beltRef = useRef(null), sunRef = useRef(null);
  useEffect(() => {
    const reduced = prefersReduced();
    const { sunR, cx, cy } = ORRERY;
    let raf, t0 = performance.now();
    const draw = (now) => {
      const T = reduced ? 0 : (now - t0) / 1000;
      ORRERY.planets.forEach((p, i) => {
        const g = pRefs.current[i]; if (!g) return;
        const ang = p.start + T * p.speed;
        const pt = orreryPoint(p.a, ang);
        const scale = 1 + pt.front * 0.14;              // a touch bigger on the near side
        // hide a planet while it passes behind the sun's disc
        const behind = pt.front < 0 && Math.hypot(pt.x - cx, pt.y - cy) < sunR + p.r;
        g.setAttribute('transform', `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) scale(${scale.toFixed(3)})`);
        g.style.opacity = behind ? '0' : '1';
        if (p.moon && moonRef.current) {
          const m = ang * 9;
          moonRef.current.setAttribute('cx', (Math.cos(m) * 7).toFixed(2));
          moonRef.current.setAttribute('cy', (Math.sin(m) * 3).toFixed(2));
        }
      });
      if (beltRef.current) {
        const off = T * 0.05;
        const kids = beltRef.current.children;
        BELT.forEach((b, i) => {
          const pt = orreryPoint(ORRERY.belt.a + b.da, b.t + off);
          kids[i].setAttribute('cx', pt.x.toFixed(2)); kids[i].setAttribute('cy', pt.y.toFixed(2));
          kids[i].style.opacity = pt.front < 0 && Math.hypot(pt.x - cx, pt.y - cy) < sunR ? '0' : '1';
        });
      }
      if (sunRef.current && !reduced) sunRef.current.setAttribute('r', (sunR + 4 + Math.sin(T * 0.8) * 1.5).toFixed(2));
      if (!reduced) raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, []);

  const { cx, cy, tilt, flat, sunR } = ORRERY;
  return html`
    <svg viewBox="0 0 400 400" className="w-full h-full max-h-full" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="Line drawing of the solar system: the sun and eight planets moving along tilted orbits">
      <g transform=${`rotate(${tilt} ${cx} ${cy})`}>
        ${ORRERY.planets.map((p) => html`<ellipse key=${p.name} cx=${cx} cy=${cy} rx=${p.a} ry=${p.a * flat}
          fill="none" stroke="var(--ink)" strokeWidth=${p.w} strokeDasharray=${p.dash || null} vectorEffect="non-scaling-stroke" />`)}
      </g>
      <g ref=${beltRef} fill="var(--ink)">
        ${BELT.map((b, i) => html`<circle key=${i} r=${b.r} cx=${cx} cy=${cy} />`)}
      </g>
      <!-- sun: solid disc with a fine breathing halo -->
      <circle ref=${sunRef} cx=${cx} cy=${cy} r=${sunR + 4} fill="none" stroke="var(--ink)" strokeWidth="0.6" strokeDasharray="1 2.5" />
      <circle cx=${cx} cy=${cy} r=${sunR} fill="var(--ink)" />
      ${ORRERY.planets.map((p, i) => html`
        <g key=${p.name} ref=${(el) => (pRefs.current[i] = el)} transform=${`translate(${cx} ${cy})`}>
          ${p.ring && html`<ellipse rx=${p.r * 2.1} ry=${p.r * 0.7} fill="none" stroke="var(--ink)" strokeWidth="1" transform=${`rotate(${tilt})`} />`}
          <circle r=${p.r} fill="var(--ink)" />
          ${p.moon && html`<circle ref=${moonRef} r="1.1" cx="7" cy="0" fill="var(--ink)" />`}
        </g>`)}
    </svg>`;
}

/* Noise → awareness → consideration: a tangle that settles into a clean circle */
function scribblePath(cx, cy, r, loops, noise, seed) {
  let d = '', n = loops * 48;
  for (let i = 0; i <= n; i++) {
    const t = (i / 48) * Math.PI * 2;
    const k = Math.sin(i * 0.37 + seed) * noise + Math.sin(i * 0.11 + seed * 2) * noise * 0.8;
    const rx = r * (1 + k), ry = r * (1 + Math.cos(i * 0.23 + seed) * noise);
    const x = cx + Math.cos(t + Math.sin(i * 0.05 + seed) * noise * 2) * rx;
    const y = cy + Math.sin(t) * ry;
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return d;
}
const SCRIBBLE_A = scribblePath(40, 40, 26, 9, 0.32, 1.3);
const SCRIBBLE_B = scribblePath(40, 40, 30, 4, 0.06, 4.1);
function FunnelSketch() {
  const steps = [
    [html`<path d=${SCRIBBLE_A} fill="none" stroke="var(--ink)" strokeOpacity=".45" strokeWidth="1.2" strokeLinejoin="round" />`, 'Noise', 'No clear voice'],
    [html`<path d=${SCRIBBLE_B} fill="none" stroke="var(--ink)" strokeOpacity=".7" strokeWidth="1.4" />`, 'Awareness', 'Visibility, impressions'],
    [html`<circle cx="40" cy="40" r="30" fill="none" stroke="var(--sky)" strokeWidth="4" />`, 'Consideration', 'Connection, conversations'],
  ];
  return html`
    <ol className="flex flex-col gap-3 sm:grid sm:grid-cols-3 sm:gap-4 max-w-[460px]" aria-label="From noise, to awareness, to consideration">
      ${steps.map(([svg, label, sub], i) => html`
        <li key=${label} className="relative flex items-center gap-3 sm:flex-col sm:items-center sm:text-center min-w-0">
          <svg viewBox="0 0 80 80" className="w-14 sm:w-full sm:max-w-[88px] h-auto shrink-0" aria-hidden="true">${svg}</svg>
          <div className="min-w-0"><span className="font-display font-semibold text-[14px] block">${label}</span><span className="text-[13px] text-ink/60 leading-tight block">${sub}</span></div>
          ${i < 2 && html`<span aria-hidden="true" className="hidden sm:block absolute right-0 top-[34px] text-sky">→</span>`}
        </li>`)}
    </ol>`;
}

/* FitBox: if the content is taller than its area, scale it down evenly until it fits, so nothing
   needs scrolling. Phones keep a readable floor and scroll past it; very short screens scroll as a page. */
function FitBox({ className = '', innerClassName = '', min = 0.6, watch, children }) {
  const outer = useRef(null), inner = useRef(null);
  useEffect(() => {
    const o = outer.current, n = inner.current; if (!o || !n) return;
    const fit = () => {
      n.style.zoom = '1';
      const cs = getComputedStyle(o);
      const avail = o.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 1; if (avail <= 0) return;
      const lo = window.innerWidth < 640 ? 0.88 : min;
      let z = 1;
      for (let k = 0; k < 5; k++) {
        const h = n.getBoundingClientRect().height;
        if (h <= avail + 0.5) break;
        z = Math.max(lo, z * (avail / h) * 0.99);
        n.style.zoom = String(z);
        if (z === lo) break;
      }
    };
    fit();
    const ro = new ResizeObserver(fit); ro.observe(o);
    document.fonts?.ready?.then(fit);
    return () => ro.disconnect();
  }, [watch]);
  return html`<div ref=${outer} className=${'min-h-0 overflow-y-auto overflow-x-hidden ' + className}><div ref=${inner} className=${innerClassName}>${children}</div></div>`;
}

/* Fit: a heading that keeps its designed size, but shrinks when one word is wider than its column
   (long names like "LaunchMyNFT" can't wrap, so they would otherwise run into the next column). */
function Fit({ as = 'h1', className = '', children, ...rest }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const fit = () => {
      el.style.fontSize = '';
      const w = el.clientWidth; if (!w) return;
      const words = [...el.querySelectorAll('[data-w]')];
      const widest = Math.max(...words.map((s) => s.getBoundingClientRect().width), 0);
      if (widest > w) {
        const cur = parseFloat(getComputedStyle(el).fontSize);
        el.style.fontSize = Math.max(16, cur * (w / widest) * 0.97) + 'px';
      }
    };
    fit();
    const ro = new ResizeObserver(fit); ro.observe(el);
    document.fonts?.ready?.then(fit);
    return () => ro.disconnect();
  }, [children]);
  // each word is measured on its own
  const text = typeof children === 'string' ? children : String(children ?? '');
  const parts = text.split(/(\s+)/);
  return React.createElement(as, { ref, className: className + ' min-w-0 max-w-full', ...rest },
    parts.map((p, i) => (/^\s+$/.test(p) ? p : React.createElement('span', { key: i, 'data-w': '', className: 'inline-block' }, p))));
}

/* Shows an address as selectable text, with a copy button (mailto/tel links are unreliable here) */
function Copyable({ label, value }) {
  const [done, setDone] = useState(false);
  const ref = useRef(null);
  const copy = () => {
    const ok = () => { setDone(true); setTimeout(() => setDone(false), 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(ref.current); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(value).then(ok, fallback); } catch (e) { fallback(); }
  };
  return html`
    <div className="flex flex-wrap items-baseline gap-x-4 gap-y-1 border-t-[1.5px] border-ink/80 py-2.5">
      <span className="tag text-ink/50 w-14 shrink-0">${label}</span>
      <span ref=${ref} className="font-mono text-[13px] select-all break-all">${value}</span>
      <button type="button" onClick=${copy} className="nav-btn tag ml-auto text-ink/60 hover:text-sky">${done ? 'Copied' : 'Copy'}</button>
    </div>`;
}

  const key = view.name + (view.id || '');
  if (view.name === 'portfolio') return html`<${PortfolioView} key=${key} ...${props} page=${page} setPage=${setPage} />`;
  if (view.name === 'project') return html`<${ProjectView} key=${key} id=${view.id} ...${props} />`;
  if (view.name === 'experience') return html`<${ExperienceView} key=${key} ...${props} />`;
  if (view.name === 'about') return html`<${AboutView} key=${key} ...${props} />`;
  if (view.name === 'contact') return html`<${ContactView} key=${key} ...${props} />`;
  if (view.name === 'index') return html`<${Hub} key=${key} ...${props} />`;
  return null;
}

/* ---------- App: solar system ⇄ sections ---------- */
function App() {
  const [phase, setPhase] = useState('space'); // space | entering | open | closing
  const phaseRef = useRef(phase); phaseRef.current = phase;
  const [view, setView] = useState({ name: null, id: null, dir: 1 });
  const viewRef = useRef(view); viewRef.current = view;
  const [page, setPage] = useState(0);
  const sysApi = useRef(null);
  const portRef = useRef(null);
  const anim = useRef(0);

  /* circular reveal of the section layer, growing out of (or shrinking into) the planet */
  const runReveal = useCallback((from, to, center, rMin, dur, done) => {
    const el = portRef.current; if (!el) return;
    cancelAnimationFrame(anim.current);
    const reduced = prefersReduced();
    const maxR = Math.max(
      Math.hypot(center.x, center.y), Math.hypot(window.innerWidth - center.x, center.y),
      Math.hypot(center.x, window.innerHeight - center.y), Math.hypot(window.innerWidth - center.x, window.innerHeight - center.y)) + 8;
    const t0 = performance.now();
    const step = (now) => {
      const k = clamp01((now - t0) / (reduced ? 220 : dur));
      const p = lerp(from, to, easeInOut(k));
      if (reduced) { el.style.clipPath = 'none'; el.style.opacity = String(p); }
      else {
        el.style.opacity = p > 0 ? '1' : '0';
        el.style.clipPath = p >= 1 ? 'none' : `circle(${lerp(rMin, maxR, p).toFixed(1)}px at ${center.x.toFixed(1)}px ${center.y.toFixed(1)}px)`;
      }
      if (k < 1) anim.current = requestAnimationFrame(step); else done && done();
    };
    anim.current = requestAnimationFrame(step);
  }, []);

  const onEnter = useCallback((key) => {
    setView({ name: key, id: null, dir: 1 }); setPage(0);
    setPhase('entering');
    const t = sysApi.current?.target() || { x: innerWidth / 2, y: innerHeight / 2, r: 40 };
    requestAnimationFrame(() => runReveal(0, 1, t, t.r, 620, () => setPhase('open')));
  }, [runReveal]);

  const close = useCallback(() => {
    if (phaseRef.current !== 'open') return;
    setPhase('closing');
    // let the system draw one frame at its zoomed state, then shrink the section into the planet
    requestAnimationFrame(() => {
      const t = sysApi.current?.target() || { x: innerWidth / 2, y: innerHeight / 2, r: 40 };
      runReveal(1, 0, t, t.r, 480, () => {
        setPhase('space');
        setView({ name: null, id: null, dir: -1 });
        sysApi.current?.returnToOrbit();
      });
    });
  }, [runReveal]);

  const go = useCallback((name, id = null, dir = 1) => setView((v) => ({ name, id, dir, from: v.name === 'index' ? 'index' : v.from })), []);
  const back = useCallback(() => {
    const v = viewRef.current;
    if (v.name === 'project') { setPage(0); setView({ name: 'portfolio', id: null, dir: -1, from: v.from }); }
    else if (v.name !== 'index') setView({ name: 'index', id: null, dir: -1 });
    else close();
  }, [close]);

  useEffect(() => {
    const onKey = (e) => {
      if (phaseRef.current !== 'open') return;
      const v = viewRef.current;
      if (e.key === 'Escape') back();
      if (v.name === 'portfolio' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft'))
        setPage((p) => clamp(p + (e.key === 'ArrowRight' ? 1 : -1), 0, PAGES - 1));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [back]);

  const showPort = phase !== 'space';

  return html`
    <main className="relative h-full w-full overflow-hidden bg-space">
      <${SolarSystem} api=${sysApi} onEnter=${onEnter} hidden=${phase === 'open'} />
      <p className="tag absolute pointer-events-none select-none" aria-hidden=${showPort ? 'true' : 'false'}
         style=${{ color: 'rgba(255,255,255,.62)', letterSpacing: '.2em', left: 'max(var(--edge), calc(env(safe-area-inset-left, 0px) + var(--edge)))', top: 'calc(env(safe-area-inset-top, 0px) + var(--edge))' }}>
        Flavio Veloso — Portfolio
      </p>
      <div
        ref=${portRef}
        hidden=${!showPort}
        className="absolute inset-0 overflow-hidden bg-paper text-ink"
        style=${{ opacity: 0, clipPath: 'circle(0px at 50% 50%)', overscrollBehavior: 'contain' }}
      >
        ${showPort && html`<${Portfolio} view=${view} go=${go} back=${back} onSun=${close} page=${page} setPage=${setPage} />`}
      </div>
    </main>`;
}
